apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-api
  labels:
    app: todo-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: todo-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: todo-api
    spec:
      containers:
      - name: todo-api
        # your-username を自分の Docker Hub ユーザー名に変更してください
        image: your-username/todo-api:v1.0.0
        ports:
        - containerPort: 5000
        envFrom:
        - configMapRef:
            name: todo-config
        - secretRef:
            name: todo-secret
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /todos
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /todos
            port: 5000
          initialDelaySeconds: 20
          periodSeconds: 15
